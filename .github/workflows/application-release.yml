# RÃ´le du fichier : valider RubyBets et publier un paquet de livraison versionnÃ© lors d'un tag rubybets-v*.

name: Application release

on:
  workflow_dispatch:
  push:
    tags:
      - "rubybets-v*"

permissions:
  contents: write

jobs:
  validate-package-release:
    runs-on: ubuntu-latest

    env:
      FOOTBALL_DATA_KEY: dummy-test-key
      FOOTBALL_DATA_API_KEY: dummy-test-key
      FOOTBALL_DATA_BASE_URL: https://api.football-data.org/v4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest

      - name: Validate ML model artifacts
        working-directory: backend
        run: python scripts/ci/validate_model_artifacts.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-manual-${GITHUB_RUN_NUMBER}}"
          PACKAGE_ROOT="release/rubybets"
          ARCHIVE="rubybets-${VERSION}.tar.gz"

          mkdir -p "${PACKAGE_ROOT}/backend" "${PACKAGE_ROOT}/frontend" "${PACKAGE_ROOT}/models" dist
          cp -R backend/app "${PACKAGE_ROOT}/backend/app"
          cp backend/requirements.txt "${PACKAGE_ROOT}/backend/requirements.txt"
          cp -R frontend/dist/. "${PACKAGE_ROOT}/frontend/"
          cp -R models/. "${PACKAGE_ROOT}/models/"
          cp README.md "${PACKAGE_ROOT}/README.md"
          cp reports/evidence/model_delivery/model_artifacts_validation.json \
            "${PACKAGE_ROOT}/model_artifacts_validation.json"

          tar -czf "dist/${ARCHIVE}" -C release rubybets
          sha256sum "dist/${ARCHIVE}" > dist/SHA256SUMS.txt

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: rubybets-application-release
          path: |
            dist/rubybets-*.tar.gz
            dist/SHA256SUMS.txt
            reports/evidence/model_delivery/model_artifacts_validation.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/rubybets-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/rubybets-*.tar.gz \
            dist/SHA256SUMS.txt \
            reports/evidence/model_delivery/model_artifacts_validation.json \
            --title "RubyBets ${GITHUB_REF_NAME}" \
            --generate-notes